services:
  - type: web
    name: youtube-transcript-rag-api
    runtime: python
    repo: https://github.com/ekagrazi/youtube-transcript-rag
    branch: main
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: >-
      python -m pip install --upgrade pip &&
      python -m pip install -r requirements.lock &&
      python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2')"
    startCommand: >-
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_REQUEST_TIMEOUT_SECONDS
        value: "10"
      - key: INGESTION_LEASE_SECONDS
        value: "900"

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false

      - key: LLM_PROVIDER
        value: hosted
      - key: HOSTED_API_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: HOSTED_API_KEY
        sync: false
      - key: HOSTED_MODEL_NAME
        value: llama-3.1-8b-instant
      - key: LLM_TEMPERATURE
        value: "0.1"
      - key: LLM_REQUEST_TIMEOUT_SECONDS
        value: "120"

      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: HF_HOME
        value: .cache/huggingface
      - key: EMBEDDING_DIMENSION
        value: "384"
      - key: EMBEDDING_BATCH_SIZE
        value: "8"
      - key: VECTOR_INSERT_BATCH_SIZE
        value: "50"
      - key: RAG_TOP_K
        value: "4"
      - key: CHAT_HISTORY_MESSAGES
        value: "6"

      - key: TRANSCRIPT_LANGUAGES
        value: en
      - key: TRANSCRIPT_CHUNK_SIZE
        value: "1000"
      - key: TRANSCRIPT_CHUNK_OVERLAP
        value: "200"
